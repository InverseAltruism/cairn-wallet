name: release

# Build, test, and publish the extension on a version tag (e.g. `git tag v0.1.0`).
# The zip is built by CI from the tagged source, never hand-uploaded, so its
# provenance is verifiable: it ships with a SHA-256 and a SLSA build-provenance
# attestation that binds it to this commit + workflow run.
on:
  push:
    tags: ["v*"]
  # Only the `anchors` job runs on a PR or the schedule; the publish jobs are gated to tag pushes below.
  pull_request:
    paths: ["src/core/spvanchors.ts", "scripts/update-spv-anchors.mjs", "src/vendor/cairnx-spv.js"]
  # Daily on the default branch, so a table that has fallen more than 6,000 below the tip is red before a tag needs it.
  schedule:
    - cron: "23 5 * * *"

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # The SPV anchor table, re-derived off the deploy host (cairn docs/Plans/86 section 3.3): walk the chain from the
  # floor pin over clarvis's public /api/headers, require every entry to equal the walk, require the public front door
  # to put each entry on its canonical chain, and fail when the newest entry is more than 6,000 below the public tip.
  # The script imports only the committed vendored bundle, so no install runs here.
  anchors:
    runs-on: ubuntu-latest
    # About 188 requests (166 header pages, 21 entry checks, the tip) paced at about 109 a minute is under 2 minutes;
    # 2 min 40 s measured 2026-10-13. 15 minutes leaves room for several 60 s Retry-After waits, not a wedged run.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node scripts/update-spv-anchors.mjs --check --headers https://clarvis.cairn-substrate.com --rpc https://cairn-substrate.com/api/rpc

  # Publish-path structural vendor gate. A MIRROR of ci.yml's vendor-fresh-full:
  # rebuild the SPV bundle from the PINNED csd-sdk source and require byte-identity with the committed bundle.
  # The release job `needs:` this, so a tag cut from a commit that bypassed master CI still cannot publish a
  # desynced fund-path bundle. Token-gated and self-skipping: without ECOSYSTEM_RO_TOKEN every step is skipped
  # (a skipped job succeeds), so the release still cuts via the cheap gate below. Keep in lockstep with
  # ci.yml's vendor-fresh-full.
  vendor-fresh-full:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.ECOSYSTEM_RO_TOKEN != '' }}
    steps:
      - if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "ECOSYSTEM_RO_TOKEN not set; skipping the full rebuild-vs-source gate on the publish path (the cheap vendor gate in 'release' still runs). Set the token to activate this."
      - if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: cairn-wallet
          persist-credentials: false
      - if: ${{ env.HAS_TOKEN == 'true' }}
        id: prov
        run: echo "commit=$(node -p "require('./cairn-wallet/src/vendor/PROVENANCE.json').csdSdkCommit")" >> "$GITHUB_OUTPUT"
      - if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: InverseAltruism/csd-sdk
          ref: ${{ steps.prov.outputs.commit }}
          token: ${{ secrets.ECOSYSTEM_RO_TOKEN }}
          path: csd-sdk
          persist-credentials: false   # the token is not left in csd-sdk/.git/config for the install and build below
      - if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - if: ${{ env.HAS_TOKEN == 'true' }}
        run: |
          PM=$(node -p "require('./csd-sdk/package.json').packageManager")
          npm i -g "$PM"
          pnpm -v
          pnpm -C csd-sdk install --frozen-lockfile && pnpm -C csd-sdk -r build
      - if: ${{ env.HAS_TOKEN == 'true' }}
        run: npm -C cairn-wallet ci --ignore-scripts
      - name: rebuild-vs-source byte-diff + noble equality
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          CSD_SDK_DIR: ${{ github.workspace }}/csd-sdk
        run: npm -C cairn-wallet run verify:vendor

  release:
    needs: [vendor-fresh-full, anchors]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC for the provenance attestation
      attestations: write   # write the attestation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts   # no dependency lifecycle scripts run in CI (supply-chain hardening)
      - run: npm run typecheck
      - run: npm test            # full gate: a broken/failed build never ships
      # Vendor-freshness gate on the publish path, cheap arm: committed SPV bundle sha256 == PROVENANCE and the
      # @noble pins agree, so a hand-edited or desynced bundle is not packaged. The rebuild-vs-source byte-diff
      # (the load-bearing arm) runs in `vendor-fresh-full` above, which this job `needs:`.
      - run: npm run verify:vendor
      - run: npm run package     # deterministic zips + .sha256 files (build.mjs tripwires run here)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          # attest BOTH artifacts: the store-upload zip (manifest at root) AND the unpacked
          # zip, so the package actually submitted to the Chrome Web Store keeps provenance.
          subject-path: |
            cairn-wallet-store.zip
            cairn-wallet.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Idempotent publish: `gh release create` hard-fails if a release for this tag
          # already exists, which leaves STALE assets in place when a tag is re-pushed
          # (this bit v0.2.21). Delete an existing release for the tag first (KEEP the tag,
          # no --cleanup-tag), then recreate. A failed delete fails the job.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" \
            cairn-wallet-store.zip cairn-wallet-store.zip.sha256 \
            cairn-wallet.zip cairn-wallet.zip.sha256 \
            --title "Cairn Wallet ${GITHUB_REF_NAME}" \
            --notes "$(printf '%s\n' \
              'Non-custodial Compute Substrate (CSD) wallet, a Chrome MV3 extension.' \
              '' \
              '**Chrome Web Store upload:** `cairn-wallet-store.zip` (manifest.json at the zip root).' \
              '**Load unpacked (dev):** unzip `cairn-wallet.zip` → `chrome://extensions` → Developer mode → Load unpacked → pick the `cairn-wallet` folder.' \
              '' \
              '**Verify (optional):**' \
              '```' \
              "sha256sum -c cairn-wallet-store.zip.sha256   # expected: $(cat cairn-wallet-store.zip.sha256)" \
              'gh attestation verify cairn-wallet-store.zip --repo ${{ github.repository }}' \
              '```' \
              '' \
              'Reproducible: `npm ci && npm run package` rebuilds byte-identical zips.')"
