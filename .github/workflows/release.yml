name: release

# Build, test, and publish the extension on a version tag (e.g. `git tag v0.1.0`).
# The zip is built by CI from the tagged source, never hand-uploaded, so its
# provenance is verifiable: it ships with a SHA-256 and a SLSA build-provenance
# attestation that binds it to this commit + workflow run.
#
# Permission split: everything that runs repository code (the install, the tests, the packager, the vendor
# rebuild) runs in jobs that can only read; the one job that holds the attestation and release permissions
# downloads the built, checksummed zips and runs no repository code at all (no checkout, no npm).
on:
  push:
    tags: ["v*"]
  # Only the `anchors` job runs on a PR; the publish jobs are gated to tag pushes below.
  pull_request:
    paths: ["src/core/spvanchors.ts", "scripts/update-spv-anchors.mjs", "src/vendor/cairnx-spv.js"]

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # The SPV anchor table, re-derived off the deploy host (cairn docs/Plans/86 section 3.3): walk the chain from the
  # floor pin over clarvis's public /api/headers, require every entry to equal the walk, require the public front door
  # to put each entry on its canonical chain, and fail when the newest entry is more than 6,000 below the public tip.
  # The script imports only the committed vendored bundle, so no install runs here.
  anchors:
    runs-on: ubuntu-latest
    # About 197 requests (174 header pages, 22 entry checks, the tip) at the measured 0.85 s each is under 3 minutes
    # (2 min 40 s for 188 requests on 2026-10-13). 15 minutes leaves room for several 60 s Retry-After waits, not a
    # wedged run; the count grows by one page per 512 blocks (docs/DESIGN-namespv-scaling.md, "What runs when").
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node scripts/update-spv-anchors.mjs --check --headers https://clarvis.cairn-substrate.com --rpc https://cairn-substrate.com/api/rpc

  # Everything that runs repository code: install, typecheck, the full suite, the vendor gate and the
  # deterministic packager. Read-only; the zips and their .sha256 files leave as one artifact.
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts   # no dependency lifecycle scripts run in CI (supply-chain hardening)
      - run: npm run typecheck
      - run: npm test            # full gate: a broken/failed build never ships
      # Vendor-freshness gate on the publish path: the SPV bundle and its .d.ts rebuilt from the installed, pinned
      # csd-sdk packages must be byte-identical to the committed files, so a hand-edited or stale bundle is not
      # packaged.
      - run: npm run verify:vendor
      - run: npm run package     # deterministic zips + .sha256 files (build.mjs tripwires run here)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zips
          path: |
            cairn-wallet-store.zip
            cairn-wallet-store.zip.sha256
            cairn-wallet.zip
            cairn-wallet.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # The only job that can mint the attestation token and write the release. It checks nothing out and installs
  # nothing: it downloads the build job's artifact, checks the zips against their .sha256 files, attests them and
  # publishes them.
  release:
    needs: [build, anchors]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # OIDC for the provenance attestation
      attestations: write   # write the attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zips
      - run: sha256sum -c cairn-wallet-store.zip.sha256 cairn-wallet.zip.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          # attest BOTH artifacts: the store-upload zip (manifest at root) AND the unpacked
          # zip, so the package actually submitted to the Chrome Web Store keeps provenance.
          subject-path: |
            cairn-wallet-store.zip
            cairn-wallet.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Idempotent publish: `gh release create` hard-fails if a release for this tag
          # already exists, which leaves STALE assets in place when a tag is re-pushed
          # (this bit v0.2.21). Delete an existing release for the tag first (KEEP the tag,
          # no --cleanup-tag), then recreate. A failed delete fails the job.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" \
            cairn-wallet-store.zip cairn-wallet-store.zip.sha256 \
            cairn-wallet.zip cairn-wallet.zip.sha256 \
            --title "Cairn Wallet ${GITHUB_REF_NAME}" \
            --notes "$(printf '%s\n' \
              'Non-custodial Compute Substrate (CSD) wallet, a Chrome MV3 extension.' \
              '' \
              '**Chrome Web Store upload:** `cairn-wallet-store.zip` (manifest.json at the zip root).' \
              '**Load unpacked (dev):** unzip `cairn-wallet.zip` → `chrome://extensions` → Developer mode → Load unpacked → pick the `cairn-wallet` folder.' \
              '' \
              '**Verify (optional):**' \
              '```' \
              "sha256sum -c cairn-wallet-store.zip.sha256   # expected: $(cat cairn-wallet-store.zip.sha256)" \
              'gh attestation verify cairn-wallet-store.zip --repo ${{ github.repository }}' \
              '```' \
              '' \
              'Reproducible: `npm ci && npm run package` rebuilds byte-identical zips.')"
