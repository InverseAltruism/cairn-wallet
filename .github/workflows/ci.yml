name: ci

# Push/PR gate: runs the typecheck, the full suite, a build, the vendor-freshness gate and a full-history secret
# scan on every push and PR, so a regression, a stale vendored SPV bundle or a committed secret cannot land on
# master uncaught.
on:
  push:
    branches: ["master", "main"]
  pull_request:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts   # no dependency lifecycle scripts (supply-chain hardening)
      - run: npm run typecheck
      # biome.json: unused imports, focused tests and @ts-ignore fail the step; empty blocks are warnings for now.
      - run: npm run lint
      # No em dash in a tracked .md outside docs/archive/; no tracked code reading a sibling checkout outside the
      # exceptions listed in the script.
      - run: npm run check:dashes-paths
      - run: npm test
      - run: npm run build
      # Vendor-freshness gate: rebuilds the SPV bundle and its .d.ts from the csd-sdk packages npm ci installed
      # (pinned in package.json, integrity in package-lock.json) and requires byte identity with the committed
      # files, plus the PROVENANCE.json hashes, package pins and @noble agreement.
      - run: npm run verify:vendor

  # Full-history secret scan with the repo's .gitleaks.toml; the pre-commit hook does not run on a commit made
  # without it or with --no-verify. The release binary is checked against gitleaks_8.18.4_checksums.txt.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # --diff-merges=first-parent: the default log shows no diff for a merge, so a secret added in a conflict
      # resolution would be missed.
      - name: gitleaks 8.18.4 (full history, blocking)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-banner --redact -c .gitleaks.toml --log-opts="--full-history --all --diff-merges=first-parent"
