name: ci

# Push/PR gate (audit NSPV-SUPPLY-1 — the wallet previously had release-tag-only CI, so a regression or a
# stale vendored SPV bundle could land on master uncaught). Runs the full suite, the typecheck, a build, and
# the vendor-freshness gate on every push and PR.
on:
  push:
    branches: ["master", "main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts   # no dependency lifecycle scripts (supply-chain hardening)
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Vendor-freshness gate (cheap path): verifies the committed SPV bundle's sha256 == PROVENANCE.json and
      # that the @noble pins match (the second crypto mirror). The full rebuild-vs-source byte-diff runs in the
      # vendor-fresh-full job below when the cross-repo token is configured; here it self-skips (cheap checks
      # still gate), so this job needs no token.
      - run: npm run verify:vendor

  # Full vendor-freshness gate (audit NSPV-SUPPLY-1 / NSPV-MIRROR-1): rebuild the SPV bundle from the PINNED
  # csd-sdk source and require byte-identity with the committed bundle (+ source @noble == wallet pins). This
  # is the structural drift guarantee — it needs the (private) csd-sdk repo, so it runs only when the operator
  # has set the ECOSYSTEM_RO_TOKEN secret (same token cairnx's CI already uses). Without it, the job no-ops and
  # the cheap gate above still runs. To fully close NSPV-SUPPLY-1 in CI, set ECOSYSTEM_RO_TOKEN.
  vendor-fresh-full:
    runs-on: ubuntu-latest
    # Run on push + same-repo PRs (where secrets are available); skip fork PRs (no secrets). The `secrets`
    # context is illegal in a job-level `if:`, so the actual token-presence is checked at step level below
    # (HAS_TOKEN): without ECOSYSTEM_RO_TOKEN the private-repo steps self-skip and the cheap gate in `test`
    # still gates — this preserves the by-design no-op, it is NOT a failure.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      HAS_TOKEN: ${{ secrets.ECOSYSTEM_RO_TOKEN != '' }}
    steps:
      - if: ${{ env.HAS_TOKEN != 'true' }}
        run: echo "ECOSYSTEM_RO_TOKEN not set — skipping the full rebuild-vs-source gate (cheap vendor gate in 'test' still runs)."
      - if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with: { path: cairn-wallet }
      # Pin the csd-sdk checkout to the EXACT commit the committed bundle records (PROVENANCE.csdSdkCommit),
      # NOT the moving master (audit M2). This makes the rebuild-vs-source byte-diff REPRODUCIBLE and turns the
      # gate into a true "the bundle matches the source commit it claims" integrity check — a benign csd-sdk
      # advance no longer false-fails the gate (the prior unpinned master checkout flipped STALE/DRIFTED on
      # every csd-sdk bump, training maintainers to ignore it). Re-vendoring updates PROVENANCE.csdSdkCommit,
      # which moves this pin in lockstep.
      - if: ${{ env.HAS_TOKEN == 'true' }}
        id: prov
        run: echo "commit=$(node -p "require('./cairn-wallet/src/vendor/PROVENANCE.json').csdSdkCommit")" >> "$GITHUB_OUTPUT"
      - if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: InverseAltruism/csd-sdk
          ref: ${{ steps.prov.outputs.commit }}
          token: ${{ secrets.ECOSYSTEM_RO_TOKEN }}
          path: csd-sdk
      - if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - if: ${{ env.HAS_TOKEN == 'true' }}
        # Install csd-sdk's OWN pinned pnpm directly (bypassing corepack). The runner's newer corepack ships a
        # pnpm that REFUSES to switch to csd-sdk's pin (pnpm 11 vs the pinned 10.x → version-mismatch error),
        # and `corepack prepare --activate` alone doesn't put pnpm on PATH. `npm i -g <pin>` is bulletproof.
        run: |
          PM=$(node -p "require('./csd-sdk/package.json').packageManager")   # e.g. pnpm@10.32.1
          echo "Installing csd-sdk's pinned package manager: $PM"
          npm i -g "$PM"
          pnpm -v
          pnpm -C csd-sdk install --frozen-lockfile && pnpm -C csd-sdk -r build
      - if: ${{ env.HAS_TOKEN == 'true' }}
        run: npm -C cairn-wallet ci --ignore-scripts
      - name: rebuild-vs-source byte-diff + noble equality
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          CSD_SDK_DIR: ${{ github.workspace }}/csd-sdk
        run: npm -C cairn-wallet run verify:vendor
