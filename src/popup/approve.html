<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cairn · Approve</title>
  <script src="ui/theme-init.js"></script>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/fonts.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="page-approve">
  <div id="app">
    <header class="ap-head"><svg class="mark" aria-hidden="true"><use href="icons.svg#mark"/></svg><span class="ap-brand">Cairn</span><span class="ap-sub">Approve request</span></header>
    <section id="view-locked" class="view view-center lock-view" hidden>
      <svg class="hero-mark" aria-hidden="true"><use href="icons.svg#mark"/></svg>
      <p class="lead">Unlock your wallet to review this request.</p>
      <div class="stack">
        <input id="unlock-pw" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="btn-unlock" class="primary">Unlock</button>
      </div>
    </section>
    <section id="view-req" hidden>
      <p class="lead">A site is requesting:</p>
      <div id="req" class="pending"></div>
      <div class="actions">
        <button id="btn-reject">Reject</button>
        <button id="btn-approve" class="primary">Approve</button>
      </div>
    </section>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="approve.js"></script>
</body>
</html>
