<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cairn · Approve</title>
  <script src="ui/theme-init.js"></script>
  <link rel="stylesheet" href="ui/tokens.css" />
  <link rel="stylesheet" href="ui/fonts.css" />
  <link rel="stylesheet" href="ui/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="page-approve">
  <div id="app">
    <header class="ap-top">
      <div class="ap-site"><span class="ap-tile"><svg class="mark" aria-hidden="true"><use href="icons.svg#mark"/></svg></span><span class="ap-who"><b id="ap-origin" class="ap-origin">Request from a site</b><small id="ap-ask" class="ap-ask">Cairn Wallet</small></span></div>
      <div id="ap-signer" class="ap-signer" hidden></div>
    </header>
    <section id="view-locked" class="view view-center lock-view" hidden>
      <svg class="hero-mark" aria-hidden="true"><use href="icons.svg#mark"/></svg>
      <p class="lead">Unlock your wallet to review this request.</p>
      <div class="stack">
        <input id="unlock-pw" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="btn-unlock" class="primary">Unlock</button>
      </div>
    </section>
    <section id="view-req" hidden>
      <div id="req" class="ap-body"></div>
      <div class="ap-foot">
        <div class="latch" aria-hidden="true"><i></i></div>
        <div class="actions">
          <button id="btn-reject">Reject</button>
          <button id="btn-approve" class="primary">Approve</button>
        </div>
      </div>
    </section>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </div>
  <script src="ui/theme.js"></script>
  <script type="module" src="approve.js"></script>
</body>
</html>
